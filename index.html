<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Brand Kit Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="error-banner" class="error-banner hidden">
    <span id="error-message"></span>
    <button id="error-dismiss" aria-label="Dismiss">×</button>
  </div>

  <header class="app-header">
    <div class="container">
      <h1 class="app-title">Brand Kit Generator</h1>
      <p class="app-subtitle">Turn any website into a complete branding kit</p>
    </div>
  </header>

  <main class="container">
    <section class="card" id="input-section">
      <label for="url-input" class="label">Enter website URL</label>
      <div class="input-row">
        <input
          type="url"
          id="url-input"
          class="text-input"
          placeholder="https://example.com"
          autocomplete="off"
        />
        <button id="generate-btn" class="btn btn-primary">Generate ▶</button>
      </div>

      <div class="asset-selector">
        <p class="label">Select assets to generate:</p>
        <div class="checkbox-row">
          <label class="checkbox">
            <input type="checkbox" name="asset" value="business-card" checked />
            <span>Business Card</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" name="asset" value="letterhead" checked />
            <span>Letterhead</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" name="asset" value="brochure" checked />
            <span>Brochure</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" name="asset" value="invoice" checked />
            <span>Invoice</span>
          </label>
        </div>
      </div>
    </section>

    <section class="card hidden" id="progress-section">
      <div class="progress-step" data-step="1">
        <span class="step-label">Step 1/3: Scraping website...</span>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>
      <div class="progress-step" data-step="2">
        <span class="step-label">Step 2/3: Analyzing brand identity...</span>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>
      <div class="progress-step" data-step="3">
        <span class="step-label">Step 3/3: Generating brand assets...</span>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>
    </section>

    <section class="card hidden" id="brand-summary">
      <button class="summary-toggle" id="summary-toggle">
        <span class="caret">▼</span> Brand Profile
      </button>
      <div class="summary-content" id="summary-content"></div>
    </section>

    <section class="card hidden" id="results-section">
      <nav class="tabs" id="asset-tabs"></nav>
      <div class="sub-toggle hidden" id="sub-toggle"></div>

      <div class="style-picker hidden" id="style-picker">
        <div class="style-picker-label">
          <span>Choose a design</span>
          <span class="style-picker-hint" id="style-picker-hint"></span>
        </div>
        <div class="style-strip" id="style-strip"></div>
      </div>

      <div class="preview-wrapper">
        <div class="preview-hint" id="preview-hint">Click any text to edit</div>
        <div class="preview-stage" id="preview-stage"></div>
      </div>
      <div class="export-row">
        <button class="btn btn-secondary" id="export-png">Export PNG ↓</button>
        <button class="btn btn-secondary" id="export-jpg">Export JPG ↓</button>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="js/scraper.js"></script>
  <script src="js/brand-extractor.js"></script>
  <script src="js/ai-processor.js"></script>
  <script src="js/image-loader.js"></script>
  <script src="templates/business-card.js"></script>
  <script src="templates/letterhead.js"></script>
  <script src="templates/brochure.js"></script>
  <script src="templates/invoice.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
